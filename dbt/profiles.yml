# Rode o dbt de dentro da pasta dbt/ com --profiles-dir .
clima:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Caminho do banco: variável CLIMA_DB (definida em .vscode/settings.json);
      # sem ela, usa o caminho relativo à pasta dbt/.
      path: "{{ env_var('CLIMA_DB', '../dados/warehouse.duckdb') }}"
      threads: 1                        # o DuckDB aceita um escritor por vez
