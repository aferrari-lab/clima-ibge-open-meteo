version: 2

sources:
  - name: bronze
    description: Dados crus, gravados pelo pacote clima (src/clima) e pelo notebook 01. O dbt só lê esta camada.
    schema: bronze
    tables:
      - name: ibge_municipios
        description: Municípios do IBGE com coordenadas e fuso horário.
        columns:
          - name: ibge_id
            data_tests: [unique, not_null]
          - name: lat
            data_tests: [not_null]
          - name: lng
            data_tests: [not_null]
          - name: fuso_horario
            data_tests: [not_null]

      - name: clima_diario
        description: Clima diário do Open-Meteo. fonte = 'archive' (dado fechado) ou 'forecast' (provisório).
        # Freshness: avisa se a carga parou de rodar (dbt source freshness).
        loaded_at_field: carregado_em
        freshness:
          warn_after: {count: 2, period: day}
          error_after: {count: 7, period: day}
        columns:
          - name: ibge_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze', 'ibge_municipios')
                    field: ibge_id
          - name: data
            data_tests: [not_null]
          - name: fonte
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['archive', 'forecast']
